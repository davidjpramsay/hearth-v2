name: Verify Hearth

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hearth-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-and-server:
    name: Web, server and browser
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: hearth
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.33.2 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run complete web and server gate
        run: pnpm verify
        env:
          CI: "true"

  android-tv:
    name: Android TV shell
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hearth
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            hearth/apps/tv/*.gradle.kts
            hearth/apps/tv/gradle/wrapper/gradle-wrapper.properties

      - name: Install Android SDK 36
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Test, lint and build television shell
        run: >-
          ./apps/tv/gradlew -p apps/tv --no-daemon
          testDebugUnitTest lintDebug lintRelease assembleDebug assembleRelease

  synology-images:
    name: Synology container images
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate Compose configuration
        run: >-
          docker compose
          --env-file hearth/deploy/synology/.env.example
          --file hearth/deploy/synology/compose.yaml
          config --quiet

      - name: Build server image
        run: >-
          docker build
          --file hearth/deploy/synology/Dockerfile
          --target server
          hearth

      - name: Build web image
        run: >-
          docker build
          --file hearth/deploy/synology/Dockerfile
          --target web
          hearth
