name: Verify Hearth

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hearth-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-and-server:
    name: Web and server
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: hearth
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: ./.github/actions/setup-hearth

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Check production and build dependency advisories
        run: pnpm audit:dependencies

      - name: Run complete code and API gate
        run: pnpm verify:code
        env:
          CI: "true"

      - name: Verify browser shard coverage
        run: pnpm verify:ci

      - name: Share this run's production build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-build
          path: |
            hearth/apps/server/dist/
            hearth/apps/web/dist/
            hearth/packages/core/dist/
            hearth/packages/shared/dist/
          if-no-files-found: error
          retention-days: 1

  browser:
    name: Browser (${{ matrix.shard }}/4)
    needs: web-and-server
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: hearth
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: ./.github/actions/setup-hearth

      - name: Restore this run's production build
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: browser-build
          path: hearth

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Test the built app with an isolated demo database
        run: pnpm test:e2e:built --shard=${{ matrix.shard }}/4 --reporter=line,blob
        env:
          CI: "true"

      - name: Retain browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-report-${{ matrix.shard }}
          path: |
            hearth/blob-report/
            hearth/test-results/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  android-tv:
    name: Android TV shell
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hearth
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            hearth/apps/tv/*.gradle.kts
            hearth/apps/tv/gradle/wrapper/gradle-wrapper.properties

      - name: Install Android SDK 36
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Test, lint and build television shell
        run: >-
          ./apps/tv/gradlew -p apps/tv --no-daemon
          testDebugUnitTest lintDebug lintRelease assembleDebug assembleRelease

  synology-images:
    name: Synology container images
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate Compose configuration
        run: |
          docker compose \
            --env-file hearth/deploy/synology/.env.example \
            --file hearth/deploy/synology/compose.yaml \
            config --quiet
          docker compose \
            --env-file hearth/deploy/synology/demo.env.example \
            --file hearth/deploy/synology/compose.demo.yaml \
            config --quiet
          docker compose \
            --env-file hearth/deploy/synology/.env.example \
            --file hearth/deploy/synology/compose.yaml \
            --file hearth/deploy/synology/compose.build.yaml \
            config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build server image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: hearth
          file: hearth/deploy/synology/Dockerfile
          target: server
          platforms: linux/amd64
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/hearth-v2-server:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Hearth v2 server
          cache-from: type=gha,scope=hearth-server-amd64
          cache-to: type=gha,mode=max,scope=hearth-server-amd64

      - name: Build web image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: hearth
          file: hearth/deploy/synology/Dockerfile
          target: web
          platforms: linux/amd64
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/hearth-v2-web:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Hearth v2 web
          cache-from: type=gha,scope=hearth-web-amd64
          cache-to: type=gha,mode=max,scope=hearth-web-amd64

  publish-synology-images:
    name: Publish verified Synology images
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [web-and-server, browser, android-tv, synology-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish server image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: hearth
          file: hearth/deploy/synology/Dockerfile
          target: server
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hearth-v2-server:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Hearth v2 server
          cache-from: type=gha,scope=hearth-server-amd64
          cache-to: type=gha,mode=max,scope=hearth-server-amd64

      - name: Publish web image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: hearth
          file: hearth/deploy/synology/Dockerfile
          target: web
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hearth-v2-web:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Hearth v2 web
          cache-from: type=gha,scope=hearth-web-amd64
          cache-to: type=gha,mode=max,scope=hearth-web-amd64
