packages:
  - apps/*
  - packages/*

# Keep transitive security patches within their existing major versions.
overrides:
  'fast-uri@>=3.0.0 <3.1.9': 3.1.9
  'fast-uri@>=4.0.0 <4.2.3': 4.2.3
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'brace-expansion@>=1.0.0 <1.1.21': 1.1.21
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
  'nanoid@<3.3.18': 3.3.18
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2

onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - sharp
