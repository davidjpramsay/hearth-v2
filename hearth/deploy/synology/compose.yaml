name: hearth-v2

services:
  server:
    image: hearth-v2-server:${HEARTH_VERSION:?Set HEARTH_VERSION to an immutable release or commit}
    build:
      context: ../..
      dockerfile: deploy/synology/Dockerfile
      target: server
    environment:
      HEARTH_MODE: private
      HEARTH_HOST: 0.0.0.0
      HEARTH_PORT: 4310
      HEARTH_LOG_LEVEL: ${HEARTH_LOG_LEVEL:-info}
      HEARTH_DATABASE_PATH: /data/hearth.sqlite
      HEARTH_CALENDAR_CONFIG_PATH: /run/hearth-secrets/calendar.json
    user: '${HEARTH_UID:?Set HEARTH_UID}:${HEARTH_GID:?Set HEARTH_GID}'
    init: true
    read_only: true
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    volumes:
      - ${HEARTH_DATA_DIR:?Set HEARTH_DATA_DIR}:/data
      - ${HEARTH_SECRETS_DIR:?Set HEARTH_SECRETS_DIR}:/run/hearth-secrets
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4310/api/v1/readiness').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  web:
    image: hearth-v2-web:${HEARTH_VERSION:?Set HEARTH_VERSION to an immutable release or commit}
    build:
      context: ../..
      dockerfile: deploy/synology/Dockerfile
      target: web
    depends_on:
      server:
        condition: service_healthy
    ports:
      - '127.0.0.1:${HEARTH_HTTP_PORT:-8432}:8080'
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1:8080/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
