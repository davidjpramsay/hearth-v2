name: HearthCompanion

options:
  bundleIdPrefix: app.hearth
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
  groupOrdering:
    - order: [HearthCompanion, HearthCompanionTests]

settings:
  base:
    SWIFT_VERSION: '6.0'
    DEVELOPMENT_TEAM: ''
    TARGETED_DEVICE_FAMILY: '1,2'
    SUPPORTS_MACCATALYST: false
    SWIFT_EMIT_LOC_STRINGS: true

targets:
  HearthCompanion:
    type: application
    platform: iOS
    sources:
      - path: HearthCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hearth.companion
        INFOPLIST_FILE: HearthCompanion/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: true
    dependencies:
      - sdk: EventKit.framework
      - sdk: Security.framework

  HearthCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HearthCompanionTests
    dependencies:
      - target: HearthCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hearth.companion.tests
        GENERATE_INFOPLIST_FILE: true
